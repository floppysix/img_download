[project]
name = "img-download"
version = "0.1.0"
description = "Image search and download module"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "selectolax>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
